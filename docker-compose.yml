services:
  minio:
    image: minio/minio
    container_name: minio_server
    restart: always
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mlops_network

  storage-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: storage-manager
    container_name: storage_manager
    restart: always
    ports:
      - "${STORAGE_MANAGER_PORT:-8001}:8001"  # Storage Manager API
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      DATA_YEAR: ${DATA_YEAR:-2023}
      DATA_MONTH: ${DATA_MONTH:-01}
    volumes:
      - ./src:/app/src
      - data_volume:/app/data
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mlops_network

  monitoring:
    build:
      context: .
      dockerfile: Dockerfile
      target: monitoring
    container_name: monitoring
    restart: always
    ports:
      - "8003:8003"  # Monitoring API
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - monitoring_volume:/app/monitoring/logs
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mlops_network

  data-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: data-service
    container_name: data_service
    restart: always
    ports:
      - "${DATA_SERVICE_PORT:-8000}:8000"  # Data ingestion and Feature engineering API
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      RAW_DATA_DIR: /app/data/raw
      PROCESSED_DATA_DIR: /app/data/processed
      DATA_YEAR: ${DATA_YEAR:-2023}
      DATA_MONTH: ${DATA_MONTH:-01}
    volumes:
      - ./src:/app/src
      - data_volume:/app/data
    depends_on:
      minio:
        condition: service_healthy
      storage-manager:
        condition: service_started
      monitoring:
        condition: service_started
    networks:
      - mlops_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: mlflow_server
    restart: always
    ports:
      - "5002:8080"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: mlflow server --host 0.0.0.0 --port 8080
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mlops_network

  training-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: training-service
    container_name: training_service
    restart: always
    ports:
      - "${TRAINING_SERVICE_PORT:-8002}:8002"  # Training Service API
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MLFLOW_TRACKING_URI: http://mlflow:8080
      DATA_YEAR: ${DATA_YEAR:-2023}
      DATA_MONTH: ${DATA_MONTH:-01}
    volumes:
      - ./src:/app/src
      - data_volume:/app/data
      - model_volume:/app/models
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
      data-service:
        condition: service_started
    networks:
      - mlops_network

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    container_name: orchestrator
    restart: always
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"  # Orchestrator API
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MLFLOW_TRACKING_URI: http://mlflow:8080
      DATA_YEAR: ${DATA_YEAR:-2023}
      DATA_MONTH: ${DATA_MONTH:-01}
    volumes:
      - ./src:/app/src
      - data_volume:/app/data
      - model_volume:/app/models
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
      data-service:
        condition: service_started
      training-service:
        condition: service_started
      monitoring:
        condition: service_started
    networks:
      - mlops_network

networks:
  mlops_network:
    driver: bridge

volumes:
  minio_data:
  mlflow_data:
  data_volume:
  model_volume:
  monitoring_volume:
